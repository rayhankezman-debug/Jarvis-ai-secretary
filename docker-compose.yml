version: '3.8'

services:
  app:
    build: .
    container_name: jarvis_app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override the DB URL to use the docker network hostname
      - DATABASE_URL=postgresql+asyncpg://user:password@db:5432/ai_secretary
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: jarvis_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ai_secretary
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d ai_secretary"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
